name: Update roster.ics

# Runs on a schedule now. The old version couldn't: it depended on a web
# session that died after an hour. This one signs in with the Eduarte app's
# refresh token (60 days, rotates on every use), which never goes through
# Microsoft, so no MFA and nothing to expire between runs.
#
# GitHub delays scheduled runs under load, so these times are approximate.
# That's fine: every run fetches the full next few weeks.
on:
  schedule:
    - cron: "13 4-20/2 * * *"   # roughly every 2 hours, 06:00-22:00 Dutch summer time
  workflow_dispatch: {}

permissions:
  contents: write

# Two runs at once would both use the same refresh token, and the loser
# would be left holding a revoked one. Queue them instead.
concurrency:
  group: roster
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Explicitly main: GitHub Pages serves main/docs.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests icalendar

      - name: Fetch roster and build roster.ics
        env:
          EDUARTE_REFRESH_TOKEN: ${{ secrets.EDUARTE_REFRESH_TOKEN }}
          # Fine-grained PAT for this repo with "Secrets: read and write",
          # used to store the rotated refresh token back. The built-in
          # GITHUB_TOKEN isn't allowed to write secrets.
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
          GH_REPO: ${{ github.repository }}
          ROTATE_SECRET: "1"
        run: python scripts/fetch_roster.py

      - name: Commit and push if changed
        run: |
          git config user.name "eduarte-to-ical bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/roster.ics
          if ! git diff --cached --quiet -- docs/roster.ics; then
            git commit -m "Update roster.ics"
            git push origin HEAD:main
          else
            echo "No changes to roster.ics"
          fi
