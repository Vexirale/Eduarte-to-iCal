name: Update roster.ics

# Manual only. There was a twice-daily schedule; it was removed because it
# could not ever succeed.
#
# Measured: the Educus session lasts about an hour (signed in 11:12,
# already dead by 12:17), and it cannot be renewed unattended because
# Microsoft Authenticator push approval happens on a phone. So any
# scheduled run lands long after the session is gone and fails. Sixteen
# consecutive scheduled runs failed that way.
#
# scripts/capture_session.py triggers this workflow itself right after
# capturing a fresh session, which is the one moment it can succeed.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Explicitly main, not the default branch. Scheduled runs fire from
      # the repo's default branch, and if that isn't main, roster.ics gets
      # committed somewhere GitHub Pages isn't serving from and the
      # published feed silently goes stale.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests icalendar beautifulsoup4 playwright pyotp
          playwright install --with-deps chromium

      - name: Fetch roster and build roster.ics
        env:
          EDUARTE_SESSION_STATE: ${{ secrets.EDUARTE_SESSION_STATE }}
          # Optional. Only used if the saved session isn't enough on its own;
          # with these set, the job recovers by itself instead of needing a
          # fresh capture_session.py run.
          EDUARTE_EMAIL: ${{ secrets.EDUARTE_EMAIL }}
          EDUARTE_PASSWORD: ${{ secrets.EDUARTE_PASSWORD }}
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
        run: python scripts/fetch_roster.py

      - name: Commit and push if changed
        run: |
          git config user.name "eduarte-to-ical bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/roster.ics
          if ! git diff --cached --quiet -- docs/roster.ics; then
            git commit -m "Update roster.ics"
            # Explicit target: never let this land on a branch Pages isn't serving.
            git push origin HEAD:main
          else
            echo "No changes to roster.ics"
          fi
