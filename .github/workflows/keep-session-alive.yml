name: Keep session alive

# Educus kills its session on inactivity, so touch it regularly to stop it
# going idle between the twice-daily roster fetches.
#
# 15 minutes rather than something closer to the (unknown, but at least
# tens-of-minutes) idle timeout, because GitHub delays scheduled workflows
# under load -- often well past their interval -- so the real gap between
# runs is always larger than what's asked for here. The margin is the
# point.
#
# This only keeps an already-live session alive; it can't create a new one
# (see scripts/keep_alive.py). Recovering a dead session is the roster
# workflow's job.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# Read-only: this job only sends a GET, it never writes to the repo.
permissions:
  contents: read

concurrency:
  # A backlog of delayed pings is worthless -- only the newest matters.
  group: keep-session-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Ping the agenda page
        env:
          EDUARTE_SESSION_STATE: ${{ secrets.EDUARTE_SESSION_STATE }}
        run: python scripts/keep_alive.py
