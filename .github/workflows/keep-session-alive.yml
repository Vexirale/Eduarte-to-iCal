name: Keep session alive

# Educus kills its session on inactivity, so touch it regularly to stop it
# going idle between the twice-daily roster fetches.
#
# Every 10 minutes, well under the idle timeout, because GitHub delays
# scheduled workflows under load (often past their interval) so the real
# gap is always larger than what's asked for here. Observed: the session
# survives gaps of at least ~22 minutes and is gone after ~6 hours, so the
# timeout is somewhere in between and may well be the usual 30 minutes.
# Three attempts inside that window is the margin.
#
# The margin matters more than it looks: this account's MFA is push
# approval only (no third-party authenticator allowed), which a script
# cannot answer. So once this session dies it cannot be recovered
# automatically at all -- it needs a manual capture_session.py run. Every
# missed ping is a real risk of that.
#
# This only keeps an already-live session alive; it can't create a new one
# (see scripts/keep_alive.py).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# Read-only: this job only sends a GET, it never writes to the repo.
permissions:
  contents: read

concurrency:
  # A backlog of delayed pings is worthless -- only the newest matters.
  group: keep-session-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Whatever ref triggered this, deliberately not pinned to main: this
      # job publishes nothing, it just reads a secret and sends one GET, so
      # it should run the code it shipped with. (Pinning it to main also
      # breaks any branch adding or changing this script, since main
      # wouldn't have that version yet.) Only the roster job, which
      # commits, needs to be pinned.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Ping the agenda page
        env:
          EDUARTE_SESSION_STATE: ${{ secrets.EDUARTE_SESSION_STATE }}
        run: python scripts/keep_alive.py
